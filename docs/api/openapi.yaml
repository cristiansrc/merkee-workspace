  /media/upload-urls:
    post:
      operationId: createMediaUploadUrl
      tags: [Media]
      summary: El admin emite una URL de subida S3 de corta duración; la subida se completa fuera de la API.
      description: Emite una URL PUT de corta duración para media S3 privada. El navegador nunca recibe credenciales de S3 y la finalización de la subida se valida por separado.
      x-idempotency: 'Se requiere `Idempotency-Key`; el alcance es admin autenticado + clave + cuerpo canónico. La misma solicitud devuelve la URL prefirmada original; la reproducción divergente devuelve 409 `IDEMPOTENCY_KEY_REUSED`.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUploadUrlRequest' } } } }
      responses: { '201': { description: URL prefirmada, content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /webhooks/wompi:
    post:
      operationId: receiveWompiWebhook
      tags: [Webhooks]
      security: []
      summary: Webhook del proveedor; se requiere el header de firma; las llamadas de cliente están prohibidas.
      description: 'La firma se valida sobre el cuerpo crudo de la solicitud antes de persistir `payment_webhook_events`; solo se almacenan y procesan los eventos con firma válida. APPROVED consume atómicamente los holds CHECKOUT_PENDING equivalentes. Si los holds no pueden consumirse, el stock nunca se decrementa y se inicia un reembolso idempotente automático; el webhook permanece deduplicado por el ID de evento del proveedor.'
      x-idempotency: el ID de evento del proveedor se deduplica antes de la transición de estado; el reembolso automático se deduplica por ID de pago.
      parameters: [{ name: X-Event-Id, in: header, required: true, schema: { type: string, minLength: 1 } }, { name: X-Event-Signature, in: header, required: true, schema: { type: string, minLength: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderWebhookPayload' } } } }
      responses: { '204': { description: 'Aceptado o duplicado idempotente; los eventos duplicados reciben 204 (no 409) y se clasifican internamente como DUPLICATE_WEBHOOK_EVENT sin proyectarse al proveedor (STAB-DEC-11 Opción A).' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /webhooks/mercado-pago:
    post:
      operationId: receiveMercadoPagoWebhook
      tags: [Webhooks]
      security: []
      summary: Webhook del proveedor; la firma del proveedor se verifica antes del procesamiento.
      description: 'La firma se valida sobre el cuerpo crudo de la solicitud antes de persistir `payment_webhook_events`; solo se almacenan y procesan los eventos con firma válida. APPROVED consume atómicamente los holds CHECKOUT_PENDING equivalentes. Si los holds no pueden consumirse, el stock nunca se decrementa y se inicia un reembolso idempotente automático; el webhook permanece deduplicado por el ID de evento del proveedor.'
      x-idempotency: el ID de evento del proveedor se deduplica antes de la transición de estado; el reembolso automático se deduplica por ID de pago.
      parameters: [{ name: X-Request-Id, in: header, required: true, schema: { type: string } }, { name: X-Signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderWebhookPayload' } } } }
      responses: { '204': { description: 'Aceptado o duplicado idempotente; los eventos duplicados reciben 204 (no 409) y se clasifican internamente como DUPLICATE_WEBHOOK_EVENT sin proyectarse al proveedor (STAB-DEC-11 Opción A).' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } , '500': { $ref: '#/components/responses/InternalServerError' } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: 'JWT de acceso; se requiere rol `admin` para los endpoints `/admin` y de media; se requiere rol `cliente` para el checkout y los pedidos propios.' }, cartSessionCookie: { type: apiKey, in: cookie, name: merkee_cart_session, description: 'Cookie opaca de sesión de invitado HttpOnly; nunca se devuelve en JSON, URL, localStorage ni logs.' } }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid }, description: UUID estable único para la mutación prevista. }
    ProductId: { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryPathId: { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    BannerId: { name: bannerId, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^[0-9]+$' }, description: '`version` esperada para el bloqueo optimista de las actualizaciones de categoría/producto/banner. Si no coincide con la versión persistida, la actualización se rechaza con 409 y no se aplica ningún cambio. No se usa en los ajustes de stock.' }
    CategoryId: { name: category_id, in: query, schema: { type: string, format: uuid } }
    Search: { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    BadRequest: { description: Entrada inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    Unauthorized: { description: Autenticación/firma fallida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    Forbidden: { description: 'Rol insuficiente o estado restringido. Los códigos de error incluyen `ACTOR_NOT_AUTHORIZED`, `ADMIN_STOREFRONT_PURCHASE_FORBIDDEN` (admin en carrito/checkout/pedidos propios) e `INITIAL_PASSWORD_CHANGE_REQUIRED` (admin con must_change_password=true en cualquier recurso protegido distinto de lectura de perfil, refresh, logout o cambio de contraseña).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    NotFound: { description: Recurso no encontrado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    Gone: { description: Sesión o reserva de carrito expirada; el cliente debe refrescar el estado del carrito, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    Conflict: { description: 'Duplicado, estado inválido, modificación concurrente o desajuste de versión de bloqueo optimista (If-Match)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    Unprocessable: { description: Falló la validación de inventario/negocio del checkout., content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    RateLimited: { description: Límite de tasa excedido, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
    InternalServerError: { description: Error inesperado del servidor, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } } }
  schemas:
    Role: { type: string, enum: [admin, cliente] }
    PaymentProvider: { type: string, enum: [WOMPI, MERCADO_PAGO] }
    OrderStatus: { type: string, enum: [PENDING_PAYMENT, PAID, PAYMENT_FAILED, PAYMENT_EXPIRED, RESERVATION_EXPIRED, PAYMENT_REFUND_PENDING, PAYMENT_REFUNDED, PAYMENT_REFUND_FAILED] }
    PaymentStatus: { type: string, enum: [PENDING, APPROVED, DECLINED, ERROR, EXPIRED, REFUNDED, REFUND_FAILED] }
    RefundStatus: { type: string, enum: [PENDING, REFUNDED, REFUND_FAILED] }
    CartStatus: { type: string, enum: [ACTIVE, CHECKOUT_PENDING, CLOSED, EXPIRED] }
    ReservationStatus: { type: string, enum: [ACTIVE, CHECKOUT_PENDING, CONSUMED, RELEASED, EXPIRED] }
    RegisterRequest: { type: object, required: [display_name, email, password], properties: { display_name: { type: string, minLength: 2, maxLength: 100 }, email: { type: string, format: email, maxLength: 254 }, password: { type: string, minLength: 12, maxLength: 128, format: password } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, minLength: 1, maxLength: 128, format: password } } }
    PasswordResetRequest: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    PasswordResetConfirmRequest: { type: object, required: [token, new_password], properties: { token: { type: string, minLength: 32, maxLength: 512 }, new_password: { type: string, minLength: 12, maxLength: 128, format: password } } }
    UpdateProfileRequest: { type: object, minProperties: 1, properties: { display_name: { type: string, minLength: 2, maxLength: 100 }, phone: { type: [string, 'null'], maxLength: 30 } } }
    UserResponse: { type: object, required: [id, display_name, email, role, must_change_password], properties: { id: { type: string, format: uuid }, display_name: { type: string }, email: { type: string, format: email }, role: { $ref: '#/components/schemas/Role' }, must_change_password: { type: boolean, description: 'Cuando es true, un admin solo puede llamar a cambio de contraseña, lectura de perfil, refresh o logout.' }, phone: { type: [string, 'null'] } } }
    PasswordChangeRequest: { type: object, required: [current_password, new_password], additionalProperties: false, properties: { current_password: { type: string, minLength: 1, maxLength: 128, format: password }, new_password: { type: string, minLength: 12, maxLength: 128, format: password } } }
    CreateAdminUserRequest: { type: object, required: [display_name, email], additionalProperties: false, properties: { display_name: { type: string, minLength: 2, maxLength: 100 }, email: { type: string, format: email, maxLength: 254 }, phone: { type: [string, 'null'], maxLength: 30 } } }
