openapi: 3.1.0
info:
  title: merkee.shop API
  version: 0.1.0-planning
  description: Contrato canónico de API Design First. Todos los valores monetarios son COP enteros. Ningún endpoint acepta datos crudos de tarjeta. Toda acción válida de usuario asociada a una sesión renueva su tiempo de inactividad de 10 minutos y las reservas ACTIVE; los webhooks del proveedor no. Los holds CHECKOUT_PENDING permanecen hasta que el pago o la conciliación alcanza un estado terminal. Las actualizaciones de categoría/producto/banner usan bloqueo optimista vía If-Match (el desajuste devuelve 409); los ajustes de stock quedan excluidos de ello.
servers:
  - url: https://api.merkee.shop/v1
security: [{ bearerAuth: [] }]
paths:
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [Auth]
      security: []
      summary: Registra un cliente e inicia una sesión.
      x-idempotency: No aplica; un correo duplicado devuelve conflicto.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Sesión creada, headers: { Location: { schema: { type: string } }, Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '429': { $ref: '#/components/responses/RateLimited' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      summary: Autentica con correo y contraseña. El cliente promueve el carrito de invitado; el admin, en cambio, libera las reservas ACTIVE del invitado, cierra su carrito y recibe una sesión de admin separada sin carrito.
      x-idempotency: No aplica; cada éxito crea una nueva sesión.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: Sesión, headers: { Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '429': { $ref: '#/components/responses/RateLimited' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      security: []
      summary: Rota la cookie de refresco HttpOnly válida y devuelve un nuevo token de acceso.
      x-idempotency: No aplica; el token rotado no puede reproducirse.
      responses: { '200': { description: Sesión refrescada, headers: { Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoca la sesión actual y libera todas las reservas activas de su carrito. El SPA limpia solo su vista derivada de carrito en Redux.
      x-idempotency: Las transiciones de revocación de sesión y liberación son idempotentes.
      responses: { '204': { description: Revocada y reservas liberadas }, '401': { $ref: '#/components/responses/Unauthorized' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      security: []
      summary: Solicita el correo de restablecimiento sin revelar la existencia del correo.
      x-idempotency: un token de restablecimiento activo por usuario; las solicitudes repetidas invalidan el predecesor.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses: { '202': { description: Aceptado independientemente de la existencia de la cuenta }, '400': { $ref: '#/components/responses/BadRequest' }, '429': { $ref: '#/components/responses/RateLimited' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /auth/password-resets:
    post:
      operationId: resetPassword
      tags: [Auth]
      security: []
      summary: Consume el token de restablecimiento de un solo uso y revoca todas las sesiones.
      x-idempotency: 'el consumo del token es atómico; la reproducción devuelve 400. La sintaxis malformada del token devuelve 400; un token sintácticamente válido pero inválido o expirado devuelve 422 `PASSWORD_RESET_TOKEN_INVALID_OR_EXPIRED`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' } } } }
      responses: { '204': { description: Contraseña cambiada }, '400': { $ref: '#/components/responses/BadRequest' }, '429': { $ref: '#/components/responses/RateLimited' } , '422': { $ref: '#/components/responses/Unprocessable', description: '422 `PASSWORD_RESET_TOKEN_INVALID_OR_EXPIRED` para un token sintácticamente válido pero inválido o expirado.' }, '500': { $ref: '#/components/responses/InternalServerError' } }
  /auth/password-change:
    post:
      operationId: changePassword
      tags: [Auth]
      summary: Cambia la contraseña actual, incluido el primer cambio obligatorio para un admin.
      description: 'Requiere autenticación y current_password. Efectos secundarios de la primera ejecución exitosa: cambia atómicamente el hash de la contraseña, limpia must_change_password cuando está establecido, revoca todas las demás sesiones, conserva solo la sesión rotada actual y responde 204 con Set-Cookie. El replay idempotente (mismo principal, Idempotency-Key y cuerpo canónico) responde 204 sin Set-Cookie y sin repetir la mutación; la detección de replay precede a la validación de current_password, por lo que un replay no vuelve a exigirla, mientras que una solicitud nueva sí la valida (422 CURRENT_PASSWORD_INVALID si falla). El replay divergente responde 409 IDEMPOTENCY_KEY_REUSED. No se devuelve ni registra ninguna credencial: idempotency_records, logs y métricas nunca persisten refresh token, hash de sesión, contraseña, secreto ni credenciales derivadas. Un admin con must_change_password=true solo puede leer el perfil, refrescar, cerrar sesión o llamar a este endpoint.'
      x-idempotency: 'Se requiere `Idempotency-Key`; el alcance es principal autenticado + clave + cuerpo de solicitud canónico. La primera ejecución exitosa devuelve 204 con Set-Cookie; el replay equivalente devuelve 204 sin Set-Cookie y sin repetir mutación, rotación ni revocación; la reproducción divergente devuelve 409 IDEMPOTENCY_KEY_REUSED. La detección de replay ocurre antes de volver a exigir current_password. La concurrencia usa retry/relectura determinista: nunca un 500 espurio ni doble rotación de cookie.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }
      responses: { '204': { description: 'Contraseña cambiada. En la primera ejecución exitosa se emite Set-Cookie con la cookie de refresco rotada; en replay idempotente del mismo principal/clave/cuerpo, 204 sin Set-Cookie y sin repetir la mutación.', headers: { Set-Cookie: { schema: { type: string }, description: 'Cookie de refresco HttpOnly rotada para la sesión actual conservada; todas las demás sesiones quedan revocadas. Solo se emite en la primera ejecución exitosa; el replay idempotente devuelve 204 sin Set-Cookie.' } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } , '422': { $ref: '#/components/responses/Unprocessable', description: '422 `CURRENT_PASSWORD_INVALID`.' }, '500': { $ref: '#/components/responses/InternalServerError' } }
  /auth/admin-activations:
    post:
      operationId: activateAdmin
      tags: [Auth]
      security: []
      summary: Consume un token de activación de admin opaco y de un solo uso y establece la primera contraseña.
      description: 'Pertenece al módulo `identity`. El token se almacena con hash, expira a las 24 horas, se consume atómicamente y nunca debe registrarse, trazarse, medirse ni devolverse.'
      x-idempotency: 'El consumo del token es atómico; una reproducción tras el éxito devuelve 400 sin revelar el estado del token. Un token sintácticamente válido pero inválido o expirado devuelve 422 `ACTIVATION_TOKEN_INVALID_OR_EXPIRED`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminActivationRequest' } } } }
      responses: { '204': { description: Admin activado }, '400': { $ref: '#/components/responses/BadRequest' }, '429': { $ref: '#/components/responses/RateLimited' }, '422': { $ref: '#/components/responses/Unprocessable', description: '422 `ACTIVATION_TOKEN_INVALID_OR_EXPIRED` para un token sintácticamente válido pero inválido o expirado.' }, '500': { $ref: '#/components/responses/InternalServerError' } }
  /me:
    get:
      operationId: getMyProfile
      tags: [Profile]
      summary: Obtiene el perfil actual.
      x-idempotency: No aplica solo lectura.
      responses: { '200': { description: Perfil, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } , '500': { $ref: '#/components/responses/InternalServerError' } }
    patch:
      operationId: updateMyProfile
      tags: [Profile]
      summary: Actualiza solo display_name y phone; el correo y el rol son inmutables y la dirección es solo una instantánea del pedido.
      x-idempotency: 'Se requiere `Idempotency-Key`; la reproducción devuelve la respuesta original.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileRequest' } } } }
      responses: { '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '409': { $ref: '#/components/responses/Conflict' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /categories:
    get:
      operationId: listCategories
      tags: [Catalog]
      security: []
      summary: Lista las categorías activas para la tienda.
      x-idempotency: No aplica solo lectura.
      responses: { '200': { description: Categorías, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CategoryResponse' } } } } } , '500': { $ref: '#/components/responses/InternalServerError' } , '429': { $ref: '#/components/responses/RateLimited' } }
  /products:
    get:
      operationId: listProducts
      tags: [Catalog]
      security: []
      summary: Busca/lista los productos activos.
      x-idempotency: No aplica solo lectura.
      parameters: [{ $ref: '#/components/parameters/CategoryId' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Productos, content: { application/json: { schema: { $ref: '#/components/schemas/PagedProductResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [Catalog]
      security: []
      summary: Obtiene un producto y el stock disponible actual.
      x-idempotency: No aplica solo lectura.
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses: { '200': { description: Producto, content: { application/json: { schema: { $ref: '#/components/schemas/ProductResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /banners:
    get:
      operationId: listActiveBanners
      tags: [Catalog]
      security: []
      summary: Lista los banners activos de la portada por orden de visualización.
      x-idempotency: No aplica solo lectura.
      responses: { '200': { description: Banners, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BannerResponse' } } } } } , '500': { $ref: '#/components/responses/InternalServerError' } , '429': { $ref: '#/components/responses/RateLimited' } }
  /cart:
    get:
      operationId: getCart
      tags: [Cart]
      security: [{ bearerAuth: [] }, { cartSessionCookie: [] }]
      summary: Obtiene el carrito del servidor y la expiración de la reserva activa para la sesión actual autenticada o de invitado.
      description: 'Efecto secundario: un acceso válido al carrito/sesión renueva su tiempo de inactividad a 10 minutos. No se persiste ningún carrito, ítem de carrito ni reserva en el almacenamiento del navegador.'
      x-idempotency: No aplica lectura; un acceso válido solo puede renovar la expiración de la misma sesión.
      responses: { '200': { description: Carrito, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 ADMIN_STOREFRONT_PURCHASE_FORBIDDEN para admin; INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '410': { $ref: '#/components/responses/Gone' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /cart/items:
    post:
      operationId: addCartItem
      tags: [Cart]
      security: [{ bearerAuth: [] }, { cartSessionCookie: [] }, {}]
      summary: Agrega cantidad de producto al carrito actual y reserva stock.
      description: 'Efectos secundarios: crea una sesión/cookie de invitado si no existe; la transacción incrementa atómicamente la reserva del ítem y products.stock_reserved. La reserva expira tras 10 minutos de inactividad.'
      x-idempotency: 'Se requiere `Idempotency-Key`; la misma sesión, clave y cuerpo de solicitud canónico devuelven el CartResponse original. Reutilizar una clave con un cuerpo diferente devuelve 409.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItemMutationRequest' } } } }
      responses: { '201': { description: Ítem de carrito reservado, headers: { Set-Cookie: { schema: { type: string }, description: Cookie de sesión de carrito de invitado solo cuando se crea una sesión de invitado. } }, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 ADMIN_STOREFRONT_PURCHASE_FORBIDDEN para admin; INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Gone' } , '422': { $ref: '#/components/responses/Unprocessable' }, '500': { $ref: '#/components/responses/InternalServerError' } }
  /cart/items/{productId}:
    put:
      operationId: setCartItemQuantity
      tags: [Cart]
      security: [{ bearerAuth: [] }, { cartSessionCookie: [] }]
      summary: Establece la cantidad reservada para un producto existente; cero no es válido y debe usarse DELETE.
      description: 'Efectos secundarios: ajusta atómicamente el delta de la reserva y `stock_reserved`; una disminución libera el delta. El acceso exitoso renueva la expiración de 10 minutos.'
      x-idempotency: 'Se requiere `Idempotency-Key`; la misma sesión, clave y cuerpo de solicitud canónico devuelven el CartResponse original; la reproducción divergente devuelve 409.'
      parameters: [{ $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetCartItemQuantityRequest' } } } }
      responses: { '200': { description: Carrito actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 ADMIN_STOREFRONT_PURCHASE_FORBIDDEN para admin; INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Gone' } , '422': { $ref: '#/components/responses/Unprocessable' }, '500': { $ref: '#/components/responses/InternalServerError' } }
    delete:
      operationId: removeCartItem
      tags: [Cart]
      security: [{ bearerAuth: [] }, { cartSessionCookie: [] }]
      summary: Elimina el ítem del carrito y libera su reserva.
      description: 'Efecto secundario: marca la reserva como liberada y decrementa `stock_reserved` atómicamente. Una solicitud repetida con la misma clave de idempotencia tiene éxito sin un segundo decremento.'
      x-idempotency: 'Se requiere `Idempotency-Key`; la misma sesión/clave devuelve 204. La reproducción divergente devuelve 409.'
      parameters: [{ $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '204': { description: Reserva liberada }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 ADMIN_STOREFRONT_PURCHASE_FORBIDDEN para admin; INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Gone' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /checkouts:
    post:
      operationId: createCheckout
      tags: [Checkout]
      summary: Consume los holds del carrito actual del servidor, crea el pedido/pago pendiente e inicializa el checkout del proveedor.
      description: 'Efectos secundarios: bloquea las reservas activas del carrito, crea el pedido/pago y puede llamar al proveedor. Los precios, el costo de envío (5000 COP), `iva_cop = floor((items_subtotal_cop * 19 + 50) / 100)` (19%, HALF_UP al peso COP) y el total son instantáneas calculadas en el servidor; el IVA se aplica exactamente una vez al subtotal de los ítems. Requiere rol de cliente. Los holds CHECKOUT_PENDING convertidos persisten hasta que el pago o la conciliación alcanza un estado terminal; no expiran por el temporizador de inactividad de 10 minutos. Devuelve 422 y no crea ningún pago para una reserva expirada o un estado de checkout inválido.'
      x-idempotency: 'Se requiere `Idempotency-Key` por intento de pago; la misma clave/cuerpo devuelve el mismo checkout pendiente.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCheckoutRequest' } } } }
      responses: { '201': { description: Checkout pendiente, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 ADMIN_STOREFRONT_PURCHASE_FORBIDDEN para admin; INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /orders:
    get:
      operationId: listMyOrders
      tags: [Orders]
      summary: Lista solo los pedidos del cliente actual.
      x-idempotency: No aplica solo lectura.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Pedidos, content: { application/json: { schema: { $ref: '#/components/schemas/PagedOrderResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 ADMIN_STOREFRONT_PURCHASE_FORBIDDEN para admin; INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /orders/{orderId}:
    get:
      operationId: getMyOrder
      tags: [Orders]
      summary: Obtiene el pedido propio; los admins usan la ruta de admin.
      x-idempotency: No aplica solo lectura.
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses: { '200': { description: Pedido, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 ADMIN_STOREFRONT_PURCHASE_FORBIDDEN para admin; INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '404': { $ref: '#/components/responses/NotFound' } , '500': { $ref: '#/components/responses/InternalServerError' } }
  /admin/users:
    post:
      operationId: provisionAdminUser
      tags: [Admin]
      summary: Aprovisiona un admin que requiere activación de un solo uso; solo un admin cuyo must_change_password sea false puede llamarlo.
      description: 'Pertenece al módulo `identity`. El tag `Admin` aquí solo agrupa la superficie HTTP; no implica propiedad de `admin-query`. Crea un admin con must_change_password=true y un token de activación con hash de 24 horas. Ni la contraseña ni el token se devuelven, registran, trazan, miden ni se colocan en el outbox. La entrega segura del token es un canal operativo aprobado fuera de esta API.'
      x-idempotency: 'Se requiere `Idempotency-Key`; el alcance es creador autenticado + clave + cuerpo canónico. La misma solicitud devuelve el 201 original; la reproducción divergente devuelve 409 IDEMPOTENCY_KEY_REUSED.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdminUserRequest' } } } }
      responses: { '201': { description: Admin aprovisionado, headers: { Location: { schema: { type: string, format: uri } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserProvisionResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' }, '404': { $ref: '#/components/responses/NotFound', description: '404 RESOURCE_NOT_FOUND en replay idempotente cuando el recurso aprovisionado fue eliminado y no existe para reconstruir la respuesta (STAB-DEC-10 Opción A).' }, '409': { $ref: '#/components/responses/Conflict' }, '429': { $ref: '#/components/responses/RateLimited' }, '500': { $ref: '#/components/responses/InternalServerError' } }
  /admin/categories:
    get:
      operationId: adminListCategories
      tags: [Admin]
      summary: Lista las categorías, incluidas las inactivas.
      responses: { '200': { description: Categorías, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CategoryResponse' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden', description: '403 INITIAL_PASSWORD_CHANGE_REQUIRED cuando el admin debe cambiar la contraseña.' } , '500': { $ref: '#/components/responses/InternalServerError' } }
    post:
      operationId: adminCreateCategory
      tags: [Admin]
      summary: El admin crea una categoría referenciando una clave de media S3 validada.
      x-idempotency: 'Se requiere `Idempotency-Key`; el alcance es admin autenticado + clave + cuerpo canónico. La misma solicitud devuelve la categoría original; la reproducción divergente devuelve 409 `IDEMPOTENCY_KEY_REUSED`.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWriteRequest' } } } }
